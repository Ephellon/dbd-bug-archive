name: Weekly archive

# Re-runs the archiver so anything posted before the knowledge base is taken
# down in October 2026 still gets captured. Runs are incremental: articles
# whose dateUpdated still matches manifest.json are skipped, and images already
# committed are left alone, so a quiet week costs a few hundred cheap requests
# and produces no commit.

on:
  schedule:
    - cron: '45 5 * * 0'   # Sundays, 05:45 UTC (shy of 06:00, where runs queue up)
  workflow_dispatch:

concurrency:
  group: archive
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  archive:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Run the archiver
        run: python3 dbd_archive.py --out archive --delay 0.5

      - name: Commit anything new
        run: |
          set -euo pipefail
          # manifest.json always changes (it records the run time), so decide
          # on the article and image files instead.
          # New articles arrive as untracked files, so ask status, not diff.
          if [ -z "$(git status --porcelain -- archive ':!archive/manifest.json')" ]; then
            echo "No new or changed articles."
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add archive
          git commit -m "Archive: weekly sync $(date -u +%Y-%m-%d)"
          git push
